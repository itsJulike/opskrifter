<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilbud</title>
<meta name="description" content="Tilbud fra tilbudsaviserne sammenlignet på literpris og stykpris">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tilbud">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%A4%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f2; --kort: #ffffff; --tekst: #1d1d1f; --svag: #6b6b70; --linje: #e4e2dc;
    --accent: #0a6b4f; --accent-bg: #e3f3ec; --bar: #9fd3bd; --bar-bedst: #0a6b4f;
    --bar-tekst: #0b2e22; --bar-bedst-tekst: #ffffff; --i-dag: #d9480f; --advarsel: #8a5a00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --kort: #1e1e21; --tekst: #f2f2f4; --svag: #a0a0a8; --linje: #2e2e33;
      --accent: #5fd3a6; --accent-bg: #173329; --bar: #2c5a49; --bar-bedst: #5fd3a6;
      --bar-tekst: #e6f7ef; --bar-bedst-tekst: #0b2e22; --i-dag: #ff8a50; --advarsel: #f0c060;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--tekst);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
           margin: 8px 0 20px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .opdateret { color: var(--svag); font-size: 13px; text-align: right; }
  h2 { font-size: 22px; margin: 28px 0 12px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--svag);
       margin: 24px 0 8px; font-weight: 600; }
  .kort { background: var(--kort); border: 1px solid var(--linje); border-radius: 14px; }

  .helt { padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px;
          border-color: var(--accent); }
  .helt .lbl { grid-column: 1 / -1; font-size: 13px; color: var(--accent); font-weight: 600; }
  .helt .butik { font-size: 24px; font-weight: 700; }
  .helt .pris { text-align: right; font-size: 30px; font-weight: 700; color: var(--accent);
                font-variant-numeric: tabular-nums; line-height: 1.1; }
  .helt .pris small { display: block; font-size: 14px; font-weight: 500; color: var(--svag); }
  .helt .detalje { grid-column: 1 / -1; color: var(--svag); font-size: 14px; }

  .skift { display: inline-flex; background: var(--kort); border: 1px solid var(--linje);
           border-radius: 999px; padding: 3px; margin-top: 16px; }
  .skift button { border: 0; background: none; color: var(--svag); font: inherit; font-size: 14px;
                  padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .skift button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent);
                                       font-weight: 600; }

  .tidslinje { padding: 12px 12px 8px; overflow: hidden; }
  .tl-gitter { display: grid; grid-template-columns: minmax(92px, 130px) repeat(14, minmax(0, 1fr));
               column-gap: 2px; row-gap: 5px; align-items: center; }
  .tl-navn { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             padding-right: 6px; }
  .tl-navn b { font-variant-numeric: tabular-nums; display: inline-block; min-width: 3.1em; }
  .tl-navn.bedst b { color: var(--accent); }
  .tl-dag { font-size: 11px; color: var(--svag); text-align: center; line-height: 1.2;
            padding: 2px 0 4px; border-bottom: 1px solid var(--linje); align-self: stretch; }
  .tl-dag b { display: block; font-size: 13px; color: var(--tekst); font-weight: 600; }
  .tl-dag.i-dag, .tl-dag.i-dag b { color: var(--i-dag); }
  .tl-dag.weekend { background: color-mix(in srgb, var(--linje) 40%, transparent); }
  .bar { border-radius: 6px; background: var(--bar); height: 24px; cursor: pointer; border: 0;
         padding: 0; }
  .bar.bedst { background: var(--bar-bedst); color: var(--bar-bedst-tekst); }
  .bar.fortsat-v { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .bar.fortsat-h { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tl-forklaring { font-size: 12px; color: var(--svag); margin: 8px 2px 0; }

  .liste { list-style: none; margin: 0; padding: 0; }
  .liste li { padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px;
              border-top: 1px solid var(--linje); }
  .liste li:first-child { border-top: 0; }
  .liste li.fremhaevet { background: var(--accent-bg); }
  .liste .butik { font-weight: 650; font-size: 17px; }
  .liste .tal { text-align: right; font-variant-numeric: tabular-nums; }
  .liste .tal .stor { font-weight: 700; font-size: 18px; }
  .liste .tal .lille { color: var(--svag); font-size: 13px; }
  .liste .info { color: var(--svag); font-size: 14px; grid-column: 1 / -1; }
  .liste .noter { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .maerke { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--linje);
            color: var(--svag); }
  .maerke.usikker { color: var(--advarsel); border-color: currentColor; }
  .tom { padding: 16px; color: var(--svag); }
  footer { color: var(--svag); font-size: 13px; margin: 32px 0 16px; }
  footer a { color: inherit; }
  .fejl { padding: 16px; color: var(--advarsel); }
  @media (max-width: 480px) {
    .tl-dag { font-size: 10px; } .tl-dag b { font-size: 11px; }
    .tl-navn { font-size: 12px; }
    .helt .butik { font-size: 21px; } .helt .pris { font-size: 26px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tilbud</h1>
    <div class="opdateret" id="opdateret"></div>
  </header>
  <div id="indhold"><p class="tom">Henter tilbud …</p></div>
  <footer>
    Data fra eTilbudsavis, hentet to gange i døgnet. Priser er uden pant.
    Type „?“: avisen skriver ikke dåse eller flaske.
    <a href="tilbud.ics">Kalender (.ics)</a>
  </footer>
</main>
<script>
(() => {
  const DAGE = 14;
  const UGEDAG = ["søn", "man", "tir", "ons", "tor", "fre", "lør"];
  const UGEDAG_LANG = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
  const kr = v => v.toLocaleString("da-DK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  let maal = "literpris";
  try { maal = localStorage.getItem("tilbud-maal") || maal; } catch (e) {}

  // I dag i dansk tid som ÅÅÅÅ-MM-DD
  const iDag = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Copenhagen" }).format(new Date());
  const dato = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const plus = (iso, n) => { const d = dato(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const kort = iso => { const d = dato(iso); return `${UGEDAG[d.getUTCDay()]} ${d.getUTCDate()}/${d.getUTCMonth() + 1}`; };
  const periode = t => `${kort(t.fra)} – ${kort(t.til)}`;

  function tilOgMed(t) {
    const dage = Math.round((dato(t.til) - dato(iDag)) / 864e5);
    if (dage === 0) return "kun i dag";
    if (dage === 1) return "til og med i morgen";
    if (dage < 7) return `til og med ${UGEDAG_LANG[dato(t.til).getUTCDay()]}`;
    return `til og med ${kort(t.til)}`;
  }

  const enhed = () => maal === "literpris" ? "kr/l" : "kr/stk";
  const andet = () => maal === "literpris" ? "stykpris" : "literpris";
  const andenEnhed = () => maal === "literpris" ? "kr/stk" : "kr/l";
  const sorter = lst => [...lst].sort((a, b) => a[maal] - b[maal] || a.fra.localeCompare(b.fra));

  function helt(vare, gaelder) {
    if (!gaelder.length) return `<div class="kort tom">Ingen tilbud på ${esc(vare.navn)} lige nu.</div>`;
    const t = sorter(gaelder)[0];
    return `<div class="kort helt">
      <div class="lbl">Billigst i dag</div>
      <div class="butik">${esc(t.butik)}</div>
      <div class="pris">${kr(t[maal])}<small>${enhed()} · ${kr(t[andet()])} ${andenEnhed()}</small></div>
      <div class="detalje">${esc(t.pakning)} for ${kr(t.pris)} kr · ${tilOgMed(t)}</div>
    </div>`;
  }

  function tidslinje(tilbud) {
    const slut = plus(iDag, DAGE - 1);
    const synlige = sorter(tilbud.filter(t => t.til >= iDag && t.fra <= slut));
    if (!synlige.length) return "";
    // Billigst pr. dag, så den kan fremhæves
    const bedstPrDag = {};
    for (let i = 0; i < DAGE; i++) {
      const d = plus(iDag, i);
      const paa = synlige.filter(t => t.fra <= d && d <= t.til);
      if (paa.length) bedstPrDag[d] = Math.min(...paa.map(t => t[maal]));
    }
    let html = "";
    for (let i = 0; i < DAGE; i++) {
      const d = dato(plus(iDag, i)); const wd = d.getUTCDay();
      html += `<div class="tl-dag${i === 0 ? " i-dag" : ""}${wd === 0 || wd === 6 ? " weekend" : ""}" style="grid-row:1;grid-column:${i + 2}" title="${kort(plus(iDag, i))}">${UGEDAG[wd][0].toUpperCase()}<b>${d.getUTCDate()}</b></div>`;
    }
    synlige.forEach((t, r) => {
      const start = Math.max(0, Math.round((dato(t.fra) - dato(iDag)) / 864e5));
      const stop = Math.min(DAGE - 1, Math.round((dato(t.til) - dato(iDag)) / 864e5));
      let bedst = false;
      for (let i = start; i <= stop; i++) if (bedstPrDag[plus(iDag, i)] === t[maal]) bedst = true;
      const kl = ["bar", bedst ? "bedst" : "", t.fra < iDag ? "fortsat-v" : "", t.til > slut ? "fortsat-h" : ""].join(" ");
      const titel = `${t.butik}: ${kr(t[maal])} ${enhed()}, ${t.pakning} for ${kr(t.pris)} kr, ${periode(t)}`;
      html += `<div class="tl-navn${bedst ? " bedst" : ""}" style="grid-row:${r + 2};grid-column:1"><b>${kr(t[maal])}</b> ${esc(t.butik)}</div>`;
      html += `<button class="${kl}" style="grid-row:${r + 2};grid-column:${start + 2} / ${stop + 3}" title="${esc(titel)}" aria-label="${esc(titel)}" data-maal="${esc(t.butik + t.fra + t.pris)}"></button>`;
    });
    return `<h3>De næste 14 dage</h3><div class="kort tidslinje"><div class="tl-gitter">${html}</div>
      <p class="tl-forklaring">Mørk bjælke = billigst på mindst én af dagene. Tryk for detaljer.</p></div>`;
  }

  function liste(lst, overskrift, bedstId) {
    if (!lst.length) return "";
    const rk = sorter(lst).map(t => {
      const id = t.butik + t.fra + t.pris;
      const maerker = [];
      if (t.type !== "?") maerker.push(`<span class="maerke">${esc(t.type)}</span>`);
      for (const n of t.noter) maerker.push(`<span class="maerke${n.includes("ikke nævnt") ? " usikker" : ""}">${esc(n)}</span>`);
      return `<li id="t-${esc(id)}" class="${id === bedstId ? "fremhaevet" : ""}" title="${esc(t.beskrivelse)}">
        <div class="butik">${esc(t.butik)}</div>
        <div class="tal"><span class="stor">${kr(t[maal])}</span> <span class="lille">${enhed()}</span></div>
        <div class="info">${esc(t.pakning)} for ${kr(t.pris)} kr · ${kr(t[andet()])} ${andenEnhed()} · ${periode(t)}</div>
        ${maerker.length ? `<div class="noter">${maerker.join("")}</div>` : ""}
      </li>`;
    }).join("");
    return `<h3>${overskrift}</h3><ul class="kort liste">${rk}</ul>`;
  }

  let data;
  function tegn() {
    const opd = new Date(data.opdateret);
    document.getElementById("opdateret").textContent =
      "Opdateret " + opd.toLocaleString("da-DK", { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Copenhagen" });
    let html = `<div class="skift" role="group" aria-label="Sammenlign på">
      <button data-v="literpris" aria-pressed="${maal === "literpris"}">Kr pr. liter</button>
      <button data-v="stykpris" aria-pressed="${maal === "stykpris"}">Kr pr. stk</button></div>`;
    for (const vare of data.varer) {
      const aktuelle = vare.tilbud.filter(t => t.til >= iDag);
      const gaelder = aktuelle.filter(t => t.fra <= iDag);
      const kommende = aktuelle.filter(t => t.fra > iDag);
      const bedst = sorter(gaelder)[0];
      html += `<h2>${esc(vare.emoji)} ${esc(vare.navn)}</h2>`;
      html += helt(vare, gaelder);
      html += tidslinje(aktuelle);
      html += liste(gaelder, "Gælder i dag", bedst && bedst.butik + bedst.fra + bedst.pris);
      html += liste(kommende, "Kommende");
    }
    document.getElementById("indhold").innerHTML = html;
  }

  document.addEventListener("click", e => {
    const knap = e.target.closest(".skift button");
    if (knap) {
      maal = knap.dataset.v;
      try { localStorage.setItem("tilbud-maal", maal); } catch (e) {}
      tegn(); return;
    }
    const bar = e.target.closest(".bar");
    if (bar) {
      const el = document.getElementById("t-" + bar.dataset.maal);
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.animate([{ outline: "2px solid var(--accent)" }, { outline: "2px solid transparent" }], { duration: 1600 });
      }
    }
  });

  fetch("aktuelle.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { data = d; tegn(); })
    .catch(() => { document.getElementById("indhold").innerHTML = '<p class="fejl">Kunne ikke hente tilbuddene. Prøv igen om lidt.</p>'; });
})();
</script>
</body>
</html>
